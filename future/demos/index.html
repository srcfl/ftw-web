<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FTW · Interactive concept</title>
  <link rel="stylesheet" href="demo.css?v=fluid-3">
  <script type="module" src="demo.mjs?v=fluid-3"></script>
</head>
<body>
  <main class="phone" id="phone">
    <header><div><span class="eyebrow">Interactive concept · Example data</span><h1 id="demo-title">Home energy</h1></div><button id="motion" type="button" aria-label="Pause motion" disabled>Ⅱ</button></header>
    <div class="scenarios" id="scenarios" role="group" aria-label="Example energy scenario">
      <button type="button" data-scenario="sun" aria-pressed="true" disabled>Solar day</button>
      <button type="button" data-scenario="evening" aria-pressed="false" disabled>Evening</button>
      <button type="button" data-scenario="night" aria-pressed="false" disabled>Night charging</button>
    </div>
    <div id="study-tools" class="study-tools" hidden></div>
    <section class="scene" id="scene" aria-label="Interactive home energy flow">
      <svg id="energy" viewBox="0 0 400 430" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <radialGradient id="sunlight"><stop stop-color="#ffcf68" stop-opacity=".7"/><stop offset="1" stop-color="#ffcf68" stop-opacity="0"/></radialGradient>
          <radialGradient id="touch-light"><stop stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="car-fill" x1="0" x2="1" y2=".6"><stop stop-color="#d6c8ff"/><stop offset=".6" stop-color="#a997e7"/><stop offset="1" stop-color="#8874c6"/></linearGradient>
          <linearGradient id="home-fill" x1="0" x2="1" y2="1"><stop stop-color="#f4efe3"/><stop offset=".8" stop-color="#d0ccc2"/><stop offset="1" stop-color="#b9b5ad"/></linearGradient>
          <linearGradient id="battery-fill" x1="0" x2="1" y2="1"><stop stop-color="#d4faec"/><stop offset=".7" stop-color="#a3ded1"/><stop offset="1" stop-color="#7cc1b7"/></linearGradient>
          <linearGradient id="grid-fill" x1="0" x2="1" y2="1"><stop stop-color="#e0eac4"/><stop offset="1" stop-color="#afc79a"/></linearGradient>
          <linearGradient id="stored-fill" x1="0" x2="1" y2="1"><stop stop-color="#ffe3a0"/><stop offset=".6" stop-color="#f2c15e"/><stop offset="1" stop-color="#d39943"/></linearGradient>
          <clipPath id="vessel-clip"><rect x="137" y="102" width="135" height="262" rx="41"/></clipPath>
          <filter id="soft-edge" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="1" dy="3" stdDeviation="5" flood-color="#28203d" flood-opacity=".13"/></filter>
        </defs>
        <g id="fields"></g><g id="field-edges"></g><g id="reservoir"></g>
        <ellipse id="sunwash" fill="url(#sunlight)" cx="180" cy="0" rx="270" ry="320"/>
        <ellipse id="touch-glow" fill="url(#touch-light)" rx="140" ry="155" opacity="0"/>
        <g id="streams"></g><g id="ring"></g><g id="particles"></g>
      </svg>
      <div id="labels"></div>
      <p id="character-caption" class="character-caption" hidden>A small companion.<br>With a little weight to it.</p>
      <div class="gesture-help"><p id="touch-hint">Drag a field. The energy follows.</p><button id="reset-example" type="button" hidden>Reset</button></div>
    </section>
    <section class="timeline" id="timeline-section" aria-label="Explore the example day">
      <div class="time-heading"><strong id="time">14:00</strong><span id="time-caption">Solar powers the home</span></div>
      <svg id="timeline" viewBox="0 0 400 85" role="slider" tabindex="0" aria-label="Explore forecast hour" aria-valuemin="0" aria-valuemax="23" aria-valuenow="14">
        <g id="curves"></g><line id="cursor" y1="0" y2="78" stroke="currentColor" stroke-opacity=".7"/><circle id="cursor-dot" cy="28" r="4" fill="currentColor"/>
        <text x="5" y="83">00</text><text x="100" y="83">06</text><text x="200" y="83">12</text><text x="300" y="83">18</text><text x="380" y="83">24</text>
      </svg>
      <div class="graph-key" aria-label="Graph colours"><span>● Solar</span><span>● Home</span><span>● Battery</span><span>● Car</span></div>
      <p>Drag across the graph to explore the day.</p>
    </section>
    <nav id="app-nav" aria-label="Example app sections"><button type="button" data-route="now" aria-pressed="true">Now</button><button type="button" data-route="plan" aria-pressed="false">Plan</button><button type="button" data-route="history" aria-pressed="false">History</button></nav>
    <section id="detail" class="detail" hidden aria-labelledby="detail-title"><button id="back" class="back" type="button">← Back to the flow</button><p class="eyebrow">Example home</p><h2 id="detail-title"></h2><strong class="detail-number" id="detail-number"></strong><p id="detail-description"></p><div id="detail-extra"></div></section>
    <div class="robot-layer"><button class="robot" id="robot" type="button" aria-label="Move the robot. Use arrow keys or drag."><img src="robot.webp" alt="" draggable="false"><span class="eyes"><i></i><i></i></span></button></div>
    <noscript><p>Enable JavaScript to try this study.</p></noscript>
  </main>
</body>
</html>
